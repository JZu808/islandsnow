<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Island Snow</title>

  <!-- Bootstrap 5 CSS (copy the exact tags from the "Bootstrap 5 Hello World" reading if versions differ) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <!-- Bootstrap Icons (step 7) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <!-- Your stylesheet loads LAST so it can override Bootstrap (step 8) -->
  <link rel="stylesheet" href="style.css">

  <!-- Bootstrap 5 JS bundle (includes Popper, which the dropdown needs) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
          crossorigin="anonymous"></script>
</head>
<body>

  <!-- ===== Practice Quiz 1: Top menubar ===== -->
  <nav class="navbar bg-light">
    <!-- .container gives the side margins; inside a .navbar it is a flex row with
         justify-content: space-between, so the two lists land left and right automatically -->
    <div class="container">

      <!-- Left-side icons: swap icon names/labels to match the screenshot -->
      <ul class="nav">
        <li class="p-1"><i class="bi bi-facebook"></i></li>
        <li class="p-1"><i class="bi bi-twitter"></i></li>
        <li class="p-1"><i class="bi bi-instagram"></i></li>
      </ul>

      <!-- Right-side icons -->
      <ul class="nav justify-content-end">
        <li class="p-1"><i class="bi bi-person"></i> Login</li>

        <!-- My Cart uses the Bootstrap Dropdown component -->
        <li class="p-1 dropdown">
          <a class="dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-cart"></i> My Cart
          </a>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><span class="dropdown-item-text">Your cart is empty</span></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="#">View Cart</a></li>
            <li><a class="dropdown-item" href="#">Checkout</a></li>
          </ul>
        </li>
      </ul>

    </div>
  </nav>

  <!-- Practice Quiz 2 (middle section) goes here on the middle-1 branch -->
    <div class="container">

    <!-- Logo -->
    <div class="row">
      <div class="col">
        <img src="images/experience-islandsnow-bootstrap-logo.png" alt="Island Snow logo"
             class="img-fluid rounded mx-auto d-block py-1">
      </div>
    </div>

    <!-- Second menu: five columns -->
    <div class="row justify-content-center pt-4 second-menu">
      <div class="col-2 text-center">MEN</div>
      <div class="col-2 text-center">WOMEN</div>
      <div class="col-2 text-center">KIDS</div>
      <div class="col-2 text-center">ACCESSORIES</div>
      <div class="col-2 text-center">BRANDS</div>
    </div>

    <!-- Bridge photo -->
    <div class="row justify-content-center pt-4">
      <div class="col">
        <img src="images/experience-islandsnow-bootstrap-main.png" alt="Bridge" class="img-fluid">
      </div>
    </div>

  </div>
  <!-- Practice Quiz 3 (footer) goes here on the footer-1 branch -->
  <footer class="islandsnow-footer mt-4 py-4">
    <div class="container">
      <div class="row">

        <div class="col">
          <h5>ISLAND SNOW</h5>
          <hr>
          About Us<br>
          Locations<br>
          Careers<br>
          Press
        </div>

        <div class="col">
          <h5>CUSTOMER SERVICE</h5>
          <hr>
          Contact Us<br>
          Shipping &amp; Returns<br>
          Order Status<br>
          Gift Cards
        </div>

        <div class="col">
          <h5>SIGN UP FOR NEWS</h5>
          <hr>
          Get the latest Island Snow news and offers.
          <div class="input-group pt-2">
            <input type="text" class="form-control" placeholder="Enter email address">
            <button class="btn btn-dark" type="button">Join</button>
          </div>
        </div>

      </div>
    </div>
  </footer>

</body>
</html>
